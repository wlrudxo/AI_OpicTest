<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPIc · 마이크 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17283d;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:55px auto;padding:0 24px}header small{color:#35664b;font-weight:700;letter-spacing:.08em}h1{font-size:34px;letter-spacing:-.04em;margin:10px 0}p{color:#526176}section{background:white;border:1px solid #dce2eb;border-radius:20px;padding:26px;margin:20px 0;box-shadow:0 5px 24px #17283d05}label{display:block;font-weight:600}select{width:100%;padding:12px;border:1px solid #cbd4df;border-radius:9px;margin:8px 0}button,.download{padding:12px 19px;border:0;border-radius:10px;background:#245b45;color:white;font:inherit;font-weight:650;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.45;cursor:default}#stop{background:#a53d3d}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#status{min-height:28px}#clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}#transcript{white-space:pre-wrap;color:#17283d;font-size:19px}audio{width:100%;margin:12px 0}#path{overflow-wrap:anywhere;font-size:12px}.muted{font-size:14px}meter{width:100%;height:15px}[hidden]{display:none!important}
</style>
<main>
<header><small>OPIc PRACTICE</small><h1>마이크로 말해보세요</h1><p>① 마이크 연결 → ② 녹음 시작 후 접근 허용 → ③ 영어로 말한 뒤 종료<br>녹음과 전사 결과는 이 PC에 저장됩니다.</p></header>
<section><label for="devices">입력 마이크</label><select id="devices"><option value="">시스템 기본 마이크</option></select><meter id="level" min="0" max="1" value="0" aria-label="마이크 입력 크기"></meter><div class="controls"><button id="start" disabled>녹음 시작</button><button id="stop" disabled>종료하고 전사</button><button id="retry" hidden>전사 다시 시도</button></div><span id="clock">00:00</span><p id="status" role="status" aria-live="polite">음성인식 서버 확인 중…</p><p class="muted">최대 5분 · 먼저 20~30초 정도 자유롭게 영어로 말해보세요.</p></section>
<section id="result" hidden><h2>내 녹음과 전사</h2><audio id="playback" controls></audio><a id="download" class="download">녹음 내려받기</a><p id="transcript"></p><p id="path" class="muted"></p></section>
</main>
<script>
const $=id=>document.getElementById(id);let recorder,stream,ctx,timer,frame,started,blob,url;
const status=text=>$('status').textContent=text;
async function devices(){const chosen=$('devices').value;const list=await navigator.mediaDevices.enumerateDevices();$('devices').replaceChildren(new Option('시스템 기본 마이크',''));list.filter(d=>d.kind==='audioinput').forEach((d,i)=>$('devices').add(new Option(d.label||`마이크 ${i+1}`,d.deviceId)));$('devices').value=chosen;}
function cleanup(){clearInterval(timer);cancelAnimationFrame(frame);stream?.getTracks().forEach(t=>t.stop());ctx?.close();ctx=null;$('level').value=0;}
async function send(){ $('retry').hidden=true;$('start').disabled=true;status('녹음을 저장하고 영어를 인식하고 있어요…');try{const response=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':blob.type},body:blob});const data=await response.json();if(!response.ok)throw new Error(data.detail||'전사 실패');$('transcript').textContent=data.text||'음성을 찾지 못했어요. 입력 마이크와 음량을 확인해주세요.';$('path').textContent=`저장: ${data.audio_path}`;status(`완료 · ${data.duration_seconds.toFixed(1)}초 녹음 / ${data.transcription_seconds.toFixed(1)}초 전사`);}catch(e){status(e.message+' · 녹음은 아래에서 내려받을 수 있어요.');$('retry').hidden=false;}finally{$('start').disabled=false;$('devices').disabled=false;}}
$('start').onclick=async()=>{ $('start').disabled=true;$('devices').disabled=true;$('retry').hidden=true;try{if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error('Chrome 또는 Edge에서 이 주소를 열어주세요.');const device=$('devices').value;stream=await navigator.mediaDevices.getUserMedia({audio:device?{deviceId:{exact:device}}:true});await devices();const type=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));if(!type)throw new Error('이 브라우저의 녹음 형식을 지원하지 않습니다. Chrome/Edge를 사용해주세요.');const chunks=[];recorder=new MediaRecorder(stream,{mimeType:type});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{cleanup();blob=new Blob(chunks,{type});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('playback').src=url;$('download').href=url;$('download').download='opic-recording.'+(type.includes('mp4')?'mp4':type.includes('ogg')?'ogg':'webm');$('result').hidden=false;$('transcript').textContent='';$('path').textContent='';await send();};recorder.onerror=()=>{status('녹음 장치 오류가 발생했습니다.');if(recorder.state==='recording')$('stop').click();};ctx=new AudioContext();await ctx.resume();const analyser=ctx.createAnalyser();ctx.createMediaStreamSource(stream).connect(analyser);const values=new Uint8Array(analyser.fftSize);function draw(){analyser.getByteTimeDomainData(values);let total=0;for(const v of values)total+=((v-128)/128)**2;$('level').value=Math.min(1,Math.sqrt(total/values.length)*5);frame=requestAnimationFrame(draw);}draw();recorder.start(1000);started=Date.now();$('clock').textContent='00:00';timer=setInterval(()=>{const seconds=Math.floor((Date.now()-started)/1000);$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>=300)$('stop').click();},250);$('stop').disabled=false;status('녹음 중 · 영어로 말해주세요.');}catch(e){cleanup();$('start').disabled=false;$('devices').disabled=false;status(e.name==='NotAllowedError'?'마이크 접근이 차단됐어요. 주소창의 사이트 권한에서 마이크를 허용하고 다시 눌러주세요.':e.name==='NotFoundError'?'마이크를 찾지 못했어요. 연결을 확인해주세요.':e.message);}};
$('stop').onclick=()=>{if(recorder?.state==='recording'){$('stop').disabled=true;recorder.stop();status('녹음을 마무리하는 중…');}};
$('retry').onclick=send;
window.addEventListener('beforeunload',e=>{if($('start').disabled){e.preventDefault();e.returnValue='';}});
(async()=>{try{const r=await fetch('/api/health');if(!r.ok)throw new Error();await r.json();$('start').disabled=false;status('준비됐어요. 녹음 시작을 눌러주세요.');await devices();}catch{status('서버 연결 또는 마이크 장치 확인에 실패했어요. start.bat 실행 후 Chrome/Edge에서 새로고침해주세요.');}})();
</script>
</html>
