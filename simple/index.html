<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPIc 간단 모의고사</title>
<style>
:root{font-family:Inter,"Segoe UI","Malgun Gothic",sans-serif;color:#17253b;background:#f7f9fc}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;padding:28px 16px 40px;display:flex;justify-content:center}
main{max-width:560px;width:100%}
h1{font-size:24px;color:#305cf0;margin:0 0 6px}
.sub{color:#6b7a90;font-size:14px;margin:0 0 22px}
.card{background:#fff;border:1px solid #dee5ef;border-radius:14px;padding:20px;margin-bottom:14px}
label{display:block;font-size:13px;color:#5b6b82;margin:0 0 6px;font-weight:600}
.row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.row button{flex:1}
button,select{font:inherit;border:1px solid #d6deea;border-radius:10px;padding:12px 16px;background:#fff;color:#263d5c;cursor:pointer}
select{width:100%;margin-bottom:16px}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{border-color:#305cf0;background:#eef3ff;color:#305cf0;font-weight:700}
.primary{background:#305cf0;border-color:#305cf0;color:#fff;width:100%;font-weight:700;font-size:17px}
.primary:hover{background:#244ac9}
details summary{cursor:pointer;color:#5b6b82;font-size:14px}
details[open] summary{margin-bottom:12px}
.small{font-size:13px;color:#8a97aa;line-height:1.6}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;color:#5b6b82;font-size:14px}
.qno{font-size:30px;font-weight:800;color:#17253b}
.qno small{font-size:16px;color:#8a97aa}
#bar{height:6px;background:#e3e9f2;border-radius:3px;overflow:hidden;margin-bottom:18px}
#bar i{display:block;height:100%;background:#305cf0;width:0}
.stage{text-align:center;padding:28px 20px}
#status{font-size:18px;font-weight:700;margin:0 0 6px}
#hint{color:#6b7a90;font-size:14px;margin:0 0 18px;min-height:20px}
#clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;color:#c3ccd9}
#clock.run{color:#17253b}#clock.warn{color:#e07b00}#clock.over{color:#d33}
#text{text-align:left;line-height:1.6;margin-top:14px}
.nav{display:flex;gap:8px}.nav button{flex:1}.nav .primary{flex:2}
ol{padding-left:22px;margin:0}ol li{margin:0 0 10px;line-height:1.5}ol li span{color:#8a97aa;font-size:13px}
</style></head><body><main>
<section id="home">
<h1>OPIc 간단 모의고사</h1>
<p class="sub">설문 생략 · 5–5 · 15문항 · 질문 2회 자동 재생</p>
<div class="card">
<label>설문 프로필</label><div class="row" id="profiles"></div>
<label for="set">회차</label><select id="set"></select>
<p class="small" id="topics"></p>
<button id="start" class="primary">시작</button>
</div>
<details class="card"><summary>음성 설정</summary>
<label for="voice">질문 음성</label><select id="voice"></select>
<label for="rate">속도</label><select id="rate"><option value="0.7">0.7 (기본)</option><option value="0.85">0.85</option><option value="1">1.0</option></select>
<button id="test">음성 확인</button>
</details>
<p class="small">자체 제작 연습문항이며 공식 기출이 아닙니다. 질문은 브라우저 TTS로 읽습니다(녹음·인식 없음). 폰은 무음 모드를 끄고 화면을 켜 두세요.</p>
</section>
<section id="exam" hidden>
<div class="head"><span id="meta"></span><span>전체 <b id="total">0:00</b></span></div>
<div class="head"><span class="qno">Q<span id="qno">1</span> <small>/ 15</small></span><span id="qtype"></span></div>
<div id="bar"><i></i></div>
<div class="card stage">
<p id="status"></p><p id="hint"></p>
<div id="clock">0:00</div>
<details id="textbox"><summary>질문 텍스트 보기</summary><p id="text"></p></details>
</div>
<div class="nav"><button id="prev">❮ 이전</button><button id="replay">↻ 다시</button><button id="next" class="primary">다음 ❯</button></div>
<p class="small" style="margin-top:14px">PC는 Enter로 다음. 답변 시계는 1분 30초에 주황, 2분에 빨강(자동으로 넘어가지 않음). <a href="#" id="quit">그만하기</a></p>
</section>
<section id="done" hidden>
<h1>끝!</h1><p class="sub" id="summary"></p>
<div class="card"><ol id="list"></ol></div>
<button id="again" class="primary">처음으로</button>
</section>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>__SPEECH__</script>
<script>__APP__</script>
</body></html>
